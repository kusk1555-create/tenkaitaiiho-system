<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Inversion Survival: Hardcore</title>
    <style>
        body { 
            background-color: #000; 
            color: #0f0; 
            font-family: monospace; 
            padding: 20px; 
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
            user-select: none;
        }
        h1 { border-bottom: 2px solid #0f0; padding-bottom: 5px; color: #ff0000; }
        .danger { color: #ff5555; }
        .safe { color: #00ffff; }
        #console { 
            white-space: pre-wrap; 
            margin-bottom: 20px; 
            min-height: 200px;
            border-left: 2px solid #0f0;
            padding-left: 10px;
            font-size: 16px;
        }
        .status-bar {
            background-color: #002200;
            padding: 5px 10px;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        #timerContainer {
            width: 100%;
            height: 20px;
            border: 1px solid #0f0;
            margin-bottom: 20px;
            background-color: #001100;
            position: relative;
        }
        #timerBar {
            height: 100%;
            width: 100%;
            background-color: #0f0;
            transition: width 0.1s linear, background-color 0.1s;
        }
        .choices-container {
            display: flex;
            gap: 10px;
        }
        .choice-btn {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 20px;
            font-size: 24px;
            font-family: monospace;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            transition: all 0.1s;
        }
        .choice-btn:hover:not(:disabled) {
            background: #0f0;
            color: #000;
        }
        .choice-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>INVERSION SURVIVAL - 3 SECONDS DEADLINE</h1>
    
    <div class="status-bar" id="statusBar">
        <span id="hpDisplay">HP: 100/100</span>
        <span id="stageDisplay">Phase 1/3</span>
        <span id="scoreDisplay">Score: 0</span>
    </div>

    <div id="timerContainer">
        <div id="timerBar"></div>
    </div>

    <div id="console">Initializing Hardcore Engine...
=========================================
 3秒以内に「現在」も「転回後」も協和音になる
 選択肢をクリックして生き延びろ。
=========================================
Press [START] to begin.</div>
    
    <div class="choices-container" id="choicesContainer">
        <button class="choice-btn" id="startBtn" onclick="startGame()">START</button>
    </div>

    <script>
        const output = document.getElementById('console');
        const hpDisplay = document.getElementById('hpDisplay');
        const stageDisplay = document.getElementById('stageDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerBar = document.getElementById('timerBar');
        const choicesContainer = document.getElementById('choicesContainer');
        
        let hp = 100;
        let score = 0;
        let questionCount = 0;
        const totalQuestions = 15;
        
        let currentConst = 9;
        let currentRule = 8;
        let currentCF = '';
        let correctAnswer = '';
        
        let timerInterval;
        let timeLeft = 3000;
        const timeLimit = 3000;
        
        const consonants = [1, 3, 5, 6, 8, 10, 12];
        const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

        function isSafe(val, constVal) {
            return consonants.includes(val) && consonants.includes(constVal - val);
        }

        function getInterval(base, target) {
            let b = notes.indexOf(base);
            let t = notes.indexOf(target);
            let diff = t - b;
            if (diff < 0) diff += 7;
            return diff + 1;
        }

        function print(text) {
            output.innerHTML = text;
        }

        function updateStatus() {
            hpDisplay.innerText = `HP: ${hp}/100`;
            scoreDisplay.innerText = `Score: ${score}`;
            let phase = questionCount < 5 ? 1 : (questionCount < 10 ? 2 : 3);
            stageDisplay.innerText = `Phase ${phase}/3 (Q.${questionCount+1})`;
            
            if(hp <= 30) hpDisplay.style.color = '#ff5555';
        }

        function getUnique(arr, count) {
            let shuffled = arr.slice().sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function generateQuestion() {
            if (hp <= 0) {
                endGame("FATAL ERROR. HP DEPLETED.");
                return;
            }
            if (questionCount >= totalQuestions) {
                endGame("COURSE CLEARED. YOU ARE A MASTER.");
                return;
            }

            updateStatus();
            
            const rules = [8, 10, 12];
            currentRule = rules[Math.floor(Math.random() * rules.length)];
            currentConst = currentRule === 8 ? 9 : (currentRule === 10 ? 11 : 13);
            
            // 現在の転回ルールを超えないように音程の限界値を設定
            const maxInterval = currentRule;
            
            let phase = questionCount < 5 ? 1 : (questionCount < 10 ? 2 : 3);
            let safeChoices = [];
            let unsafeChoices = [];
            let qText = `[ 転回規則: ${currentRule}度転回 (y = ${currentConst} - x) ]\n\n`;

            if (phase === 1) {
                qText += "安全な【音程】を選択せよ。";
                for (let i=1; i<=maxInterval; i++) {
                    if (isSafe(i, currentConst)) safeChoices.push(i.toString());
                    else unsafeChoices.push(i.toString());
                }
            } else if (phase === 2) {
                qText += "安全な【掛留】または【音程】を選択せよ。";
                for (let i=1; i<=maxInterval; i++) {
                    if (isSafe(i, currentConst)) safeChoices.push(i.toString());
                    else unsafeChoices.push(i.toString());
                }
                const suspensions = ['7-6', '4-3', '9-8', '2-3', '6-5', '11-10'];
                for (let s of suspensions) {
                    let parts = s.split('-');
                    let req1 = parseInt(parts[0]);
                    let req2 = parseInt(parts[1]);
                    // 掛留の音程が限界値を超えている場合は選択肢から除外
                    if (req1 <= maxInterval && req2 <= maxInterval) {
                        if (isSafe(req2, currentConst)) safeChoices.push(s);
                        else unsafeChoices.push(s);
                    }
                }
            } else {
                currentCF = notes[Math.floor(Math.random() * notes.length)];
                qText += `定旋律(CF)は 【 ${currentCF} 】 だ。\n安全な対位声部の【音名】を選択せよ。`;
                for (let n of notes) {
                    let iv = getInterval(currentCF, n);
                    if (isSafe(iv, currentConst)) safeChoices.push(n);
                    else unsafeChoices.push(n);
                }
            }

            // 安全な選択肢が存在しない場合のエラーハンドリング
            if (safeChoices.length === 0) {
                safeChoices.push('3'); // フォールバック
            }
            correctAnswer = getUnique(safeChoices, 1)[0];
            let wrongs = getUnique(unsafeChoices, 2);
            
            let choices = [correctAnswer, wrongs[0], wrongs[1]];
            choices.sort(() => 0.5 - Math.random());

            print(qText);
            renderButtons(choices);
            startTimer();
        }

        function renderButtons(choices) {
            choicesContainer.innerHTML = '';
            choices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => handleChoice(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function startTimer() {
            timeLeft = timeLimit;
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#0f0';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 50;
                let percent = (timeLeft / timeLimit) * 100;
                timerBar.style.width = `${percent}%`;
                
                if (percent < 30) {
                    timerBar.style.backgroundColor = '#ff5555';
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 50);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function disableButtons() {
            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(b => b.disabled = true);
        }

        function handleChoice(selected) {
            stopTimer();
            disableButtons();
            
            let timeBonus = Math.floor(timeLeft / 100);
            
            if (selected === correctAnswer) {
                let pts = 50 + timeBonus;
                score += pts;
                print(`[ SUCCESS ] 正解だ。\nScore +${pts}`);
            } else {
                hp -= 25;
                print(`[ <span class="danger">FATAL</span> ] 不協和音が発生した。\n正解は [ ${correctAnswer} ] だ。\nDamage -25`);
            }
            
            updateStatus();
            questionCount++;
            setTimeout(generateQuestion, 1500);
        }

        function handleTimeout() {
            disableButtons();
            hp -= 30;
            print(`[ <span class="danger">TIME OUT</span> ] 思考が遅すぎる。\n正解は [ ${correctAnswer} ] だ。\nDamage -30`);
            updateStatus();
            questionCount++;
            setTimeout(generateQuestion, 1500);
        }

        function startGame() {
            hp = 100;
            score = 0;
            questionCount = 0;
            hpDisplay.style.color = '#0f0';
            generateQuestion();
        }

        function endGame(msg) {
            choicesContainer.innerHTML = '<button class="choice-btn" onclick="startGame()">RESTART</button>';
            print(`=========================================\n ${msg}\n Final Score: ${score}\n=========================================`);
            timerBar.style.width = '0%';
        }
    </script>
</body>
</html>

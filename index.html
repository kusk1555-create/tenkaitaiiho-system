<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Inversion Survival</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #console { white-space: pre-wrap; margin-bottom: 20px; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; font-family: monospace; }
        button { background: #0f0; color: #000; border: none; padding: 5px 10px; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>
    <div id="console">=========================================
 INVERSION SURVIVAL - Browser Edition
=========================================
Start game?</div>
    <input type="text" id="userInput" placeholder="Type here..." autocomplete="off">
    <button onclick="handleInput()">Enter</button>

    <script>
        const output = document.getElementById('console');
        const input = document.getElementById('userInput');
        let state = 'init';
        let hp = 100;
        let turn = 0;
        let currentStage = 0;
        let currentInv = 8;
        let currentConstant = 9;

        const stages = [
            { name: "Stage 1: 8th Inversion", invs: [8] },
            { name: "Stage 2: 10th Inversion", invs: [10] },
            { name: "Stage 3: 12th Inversion", invs: [12] }
        ];

        function print(text) {
            output.textContent += '\n' + text;
            window.scrollTo(0, document.body.scrollHeight);
        }

        function getConstant(inv) {
            return inv === 8 ? 9 : (inv === 10 ? 11 : 13);
        }

        function nextTurn() {
            if (hp <= 0) {
                print("\n=========================================\n GAME OVER. You failed the course.\n=========================================");
                state = 'end';
                return;
            }
            if (turn >= 3) {
                print(`\n[${stages[currentStage].name} cleared]`);
                currentStage++;
                turn = 0;
                if (currentStage >= stages.length) {
                    print(`\n=========================================\n YOU SURVIVED.\n Final HP: ${hp}/100\n=========================================`);
                    state = 'end';
                    return;
                }
            }
            
            const stage = stages[currentStage];
            currentInv = stage.invs[Math.floor(Math.random() * stage.invs.length)];
            currentConstant = getConstant(currentInv);
            
            print(`\n--- ${stage.name} ---`);
            print(`[Professor]\nNext Inversion: ${currentInv}th (y = ${currentConstant} - x)`);
            print(`\n[Your Turn]\nEnter interval (e.g., '3', '7->6'): > `);
            state = 'playing';
        }

        function handleInput() {
            const val = input.value.trim();
            input.value = '';
            
            if (state === 'init') {
                nextTurn();
                return;
            }
            if (state !== 'playing') return;

            print(val);
            
            const isSuspension = val.includes('->');
            const consonants = [1, 3, 5, 6, 8, 10, 12];

            if (isSuspension) {
                const parts = val.split('->').map(Number);
                if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                    const invA = currentConstant - parts[0];
                    const invB = currentConstant - parts[1];
                    print(`\n[Result]\nInversion (${currentInv}th): Evaluated as ${invA}->${invB}`);
                    if (consonants.includes(invB)) {
                        print("Evaluation: Resolution to Consonant. (Safe)");
                    } else {
                        hp -= 20;
                        print(`Evaluation: Resolution to Dissonant.\nResult: FATAL. Damage -20.\nReason: 解決先が不協和音です。`);
                    }
                } else {
                    print("Invalid format."); return;
                }
            } else {
                const x = Number(val);
                if (!isNaN(x) && x >= 1 && x <= 12) {
                    const y = currentConstant - x;
                    print(`\n[Result]\nInversion (${currentInv}th): ${currentConstant} - ${x} = ${y}`);
                    if (consonants.includes(y)) {
                        print(`Evaluation: Consonant (${y}th). (Safe)`);
                    } else {
                        hp -= 20;
                        print(`Evaluation: Dissonant (${y}th).\nResult: FATAL. Damage -20.\nReason: ${y}度は不協和音です。`);
                    }
                } else {
                    print("Invalid input."); return;
                }
            }
            
            print(`Current HP: ${hp}/100`);
            turn++;
            setTimeout(nextTurn, 1000);
        }

        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") handleInput();
        });
    </script>
</body>
</html>
